name: mobile
description: "Antigravity Remote 2.0 Mobile Companion App"
publish_to: 'none'

version: 3.3.3+6


environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  mobile_scanner: ^5.2.3
  flutter_local_notifications: ^19.5.0
  meta: ^1.16.0
  shared_preferences: ^2.5.3
  http: ^1.6.0
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  sqflite: ^2.4.2
  path: ^1.9.1
  file_picker: ^11.0.3
  image_picker: ^1.2.1
  # SEC-04 : jetons daemon / PIN déplacés de SharedPreferences (XML en clair,
  # inclus dans les backups adb) vers le Keychain/Keystore système.
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/app_icon.png
    - assets/logo_banner.png
    - assets/logo_light.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21