syntax = "proto3";

// file: exa/code_edit/code_edit_pb/code_edit.proto
// package: exa.code_edit.code_edit_pb
message RelevantCodeContext {
  optional .exa.codeium_common_pb.CodeContextItem code_context_item = 1;
  optional .exa.code_edit.code_edit_pb.RelevanceReason relevance_reason = 3;
}
message IntentRelevance {
  optional string intent = 1;
  optional float relevance_score = 2;
  optional string rationale = 3;
}
message CodeContextItemChange {
  optional .exa.codeium_common_pb.CodeContextItem start_cci = 1;
  optional .exa.codeium_common_pb.CodeContextItem end_cci = 2;
  repeated .exa.code_edit.code_edit_pb.RelevantCodeContext relevant_code_contexts = 3;
  repeated .exa.code_edit.code_edit_pb.CodeContextItemChange.DescriptionByTypeEntry description_by_type = 4;
  repeated .exa.code_edit.code_edit_pb.IntentRelevance intent_relevance = 5;
  message DescriptionByTypeEntry {
    optional string key = 1;
    optional string value = 2;
  }
}
message FileChange {
  optional string start_file_path_migrate_me_to_uri = 1;
  optional string start_file_uri = 10;
  optional string start_file_rel_path = 8;
  optional string end_file_path_migrate_me_to_uri = 2;
  optional string end_file_uri = 11;
  optional string end_file_rel_path = 9;
  optional string old_file_content = 3;
  optional string new_file_content = 4;
  repeated .exa.code_edit.code_edit_pb.CodeContextItemChange code_context_item_changes = 6;
  repeated .exa.codeium_common_pb.CodeContextItem unchanged_code_context_items = 7;
}
message Intent {
  optional string intent = 1;
  optional .exa.code_edit.code_edit_pb.IntentType intent_type = 2;
  optional bool include_test_files = 3;
}
message CodeChangeWithContext {
  optional .exa.codeium_common_pb.GitRepoInfo repository = 1;
  repeated .exa.code_edit.code_edit_pb.FileChange file_changes = 2;
  repeated .exa.code_edit.code_edit_pb.FileChange test_file_changes = 9;
  optional string intent = 3;
  optional .exa.code_edit.code_edit_pb.GitCommit git_commit = 4;
  optional .exa.index_pb.IndexStats index_stats = 5;
  repeated .exa.codeium_common_pb.CodeContextItem unrelated_ccis = 6;
  repeated .exa.code_edit.code_edit_pb.Intent synthetic_intents = 8;
}
message GitCommit {
  optional string commit_hash = 1;
  optional string parent_commit_hash = 2;
}
message CommitToFileChangeRequest {
  optional string repo_root = 1;
  optional .exa.codeium_common_pb.GitRepoInfo repository = 2;
  optional int32 unrelated_cci_multiple = 3;
  optional string db_dir = 4;
}
message GitFilePatch {
  optional string from = 1;
  optional string to = 2;
}
message CommitToFileChangeResponse {
  repeated .exa.code_edit.code_edit_pb.FileChange file_changes = 1;
  optional string parent_commit_hash = 2;
  optional .exa.index_pb.IndexStats index_stats = 3;
  repeated .exa.codeium_common_pb.CodeContextItem unrelated_ccis = 4;
}
message CodeRetrievalEvalTask {
  optional .exa.codeium_common_pb.GitRepoInfo repository = 1;
  optional .exa.code_edit.code_edit_pb.GitCommit commit_info = 5;
  optional string query = 2;
  repeated .exa.code_edit.code_edit_pb.RelevantCodeContext target_code_contexts = 3;
  optional string subdirectory = 4;
}
message CodeRetrievalResult {
  optional .exa.codeium_common_pb.GitRepoInfo repository = 1;
  optional string retriever_name = 3;
  optional .exa.code_edit.code_edit_pb.RetrieverInfo retriever_info = 4;
  repeated .exa.context_module_pb.CodeContextItemWithRetrievalMetadata code_context_with_metadatas = 5;
}
message RetrieverClassification {
  optional float relevance_score = 1;
  optional .exa.code_edit.code_edit_pb.RetrieverInfo retriever_info = 2;
}
message CodeContextItemWithClassification {
  optional .exa.code_edit.code_edit_pb.RelevantCodeContext code_context_item = 1;
  optional bool relevant = 2;
  optional .exa.code_edit.code_edit_pb.RetrieverClassification prediction = 3;
}
message RetrieverInfo {
  optional .exa.code_edit.code_edit_pb.RetrieverType type = 1;
  optional string model_name = 2;
}
message RetrievalMetrics {
  optional .exa.code_edit.code_edit_pb.RetrieverInfo retriever_info = 1;
  optional float precision_score = 2;
  optional float recall_score = 3;
  optional float accuracy_score = 4;
  optional float label_ranking_average_precision_score = 5;
  optional float roc_auc_score = 6;
  optional float average_precision_score = 7;
  optional float threshold = 8;
}
message CodeRetrievalEvalResult {
  optional .exa.codeium_common_pb.GitRepoInfo repository = 1;
  repeated .exa.code_edit.code_edit_pb.CodeContextItemWithClassification classified_items = 2;
  optional .exa.code_edit.code_edit_pb.RetrievalMetrics metrics = 3;
}
message InstructionWithId {
  optional int32 id = 1;
  optional string file = 2;
  optional string function = 3;
  optional string instruction = 4;
}
message InstructionWithIdList {
  repeated .exa.code_edit.code_edit_pb.InstructionWithId instructions = 1;
}
