message EditNotebookRequest {
  optional string absolute_path_uri = 1;
  optional .exa.extension_server_pb.EditNotebookOperation operation = 2;
  optional string anchor_cell_id = 3;
  optional int32 anchor_cell_index = 4;
  repeated .exa.extension_server_pb.EditNotebookRequest.Cell cells = 5;
  optional int32 delete_count = 6;
  message Cell {
    optional string kind = 1;
    optional string content = 2;
  }
}
message EditNotebookResponse {
  repeated .exa.extension_server_pb.EditNotebookResponse.ModifiedCell modified_cells = 1;
  optional int32 total_cell_count = 2;
  message ModifiedCell {
    optional string cell_id = 1;
    optional string kind = 2;
    optional string content = 3;
    optional int32 index = 4;
  }
}
message ReadNotebookRequest {
  optional string absolute_path_uri = 1;
  repeated int32 cell_indices = 2;
  repeated string cell_ids = 3;
}
message ReadNotebookResponse {
  optional string flattened_content = 1;
  optional int32 read_cell_count = 2;
  repeated .exa.cortex_pb.NotebookBlob blobs = 3;
}
message ExecuteNotebookRequest {
  optional string absolute_path_uri = 1;
  repeated string cell_ids = 2;
  repeated int32 cell_indices = 3;
  optional bool stop_on_error = 4;
  optional bool restart_kernel = 5;
}
message ExecuteNotebookResponse {
  optional .exa.extension_server_pb.ExecuteNotebookResponse.ExecutionStatus status = 1;
  optional int32 executed_cells_count = 2;
  repeated .exa.extension_server_pb.ExecuteNotebookResponse.CellOutput cell_outputs = 3;
  optional string error_trace = 4;
  message CellOutput {
    optional string cell_id = 1;
    optional int32 cell_index = 2;
    optional .exa.extension_server_pb.ExecuteNotebookResponse.CellStatus status = 3;
    optional string output_text = 4;
    optional bool output_text_truncated = 5;
    optional bool generated_images = 6;
    optional string error_trace = 7;
    repeated .exa.cortex_pb.NotebookBlob blobs = 8;
  }
  enum CellStatus {
    CELL_STATUS_UNSPECIFIED = 0;
    CELL_STATUS_SUCCESS = 1;
    CELL_STATUS_FAILURE = 2;
  }
  enum ExecutionStatus {
    EXECUTION_STATUS_UNSPECIFIED = 0;
    EXECUTION_STATUS_SUCCESS = 1;
    EXECUTION_STATUS_FAILURE = 2;
    EXECUTION_STATUS_PARTIAL_SUCCESS = 3;
  }
}
