syntax = "proto3";

// file: google/api/field_info.proto
// package: google.api
message FieldInfo {
  optional .google.api.FieldInfo.Format format = 1;
  repeated .google.api.TypeReference referenced_types = 2;
  enum Format {
    FORMAT_UNSPECIFIED = 0;
    UUID4 = 1;
    IPV4 = 2;
    IPV6 = 3;
    IPV4_OR_IPV6 = 4;
  }
}
message TypeReference {
  optional string type_name = 1;
}
