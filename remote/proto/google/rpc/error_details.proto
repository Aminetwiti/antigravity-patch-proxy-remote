syntax = "proto3";

// file: google/rpc/error_details.proto
// package: google.rpc
message ErrorInfo {
  optional string reason = 1;
  optional string domain = 2;
  repeated .google.rpc.ErrorInfo.MetadataEntry metadata = 3;
  message MetadataEntry {
    optional string key = 1;
    optional string value = 2;
  }
}
message RetryInfo {
  optional .google.protobuf.Duration retry_delay = 1;
}
message DebugInfo {
  repeated string stack_entries = 1;
  optional string detail = 2;
}
message QuotaFailure {
  repeated .google.rpc.QuotaFailure.Violation violations = 1;
  message Violation {
    optional string subject = 1;
    optional string description = 2;
    optional string api_service = 3;
    optional string quota_metric = 4;
    optional string quota_id = 5;
    repeated .google.rpc.QuotaFailure.Violation.QuotaDimensionsEntry quota_dimensions = 6;
    optional int64 quota_value = 7;
    optional int64 future_quota_value = 8;
    message QuotaDimensionsEntry {
      optional string key = 1;
      optional string value = 2;
    }
  }
}
message PreconditionFailure {
  repeated .google.rpc.PreconditionFailure.Violation violations = 1;
  message Violation {
    optional string type = 1;
    optional string subject = 2;
    optional string description = 3;
  }
}
message BadRequest {
  repeated .google.rpc.BadRequest.FieldViolation field_violations = 1;
  message FieldViolation {
    optional string field = 1;
    optional string description = 2;
    optional string reason = 3;
    optional .google.rpc.LocalizedMessage localized_message = 4;
  }
}
message RequestInfo {
  optional string request_id = 1;
  optional string serving_data = 2;
}
message ResourceInfo {
  optional string resource_type = 1;
  optional string resource_name = 2;
  optional string owner = 3;
  optional string description = 4;
}
message Help {
  repeated .google.rpc.Help.Link links = 1;
  message Link {
    optional string description = 1;
    optional string url = 2;
  }
}
message LocalizedMessage {
  optional string locale = 1;
  optional string message = 2;
}
