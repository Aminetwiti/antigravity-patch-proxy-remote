version: '3.8'

services:
  antigravity-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: antigravity-remote-daemon
    restart: unless-stopped
    ports:
      - "8090:8090"
      - "41234:41234/udp"
    environment:
      - PORT=8090
      - HOST=0.0.0.0
      - TUNNEL=cloudflare
      - AUTH_TOKEN=${AUTH_TOKEN:-}
      - APPROVAL_TIMEOUT=300
    volumes:
      - ./data:/data
      # SÉCURITÉ : Remplacement du montage en clair des clés privées ~/.ssh par l'agent SSH forwarding si disponible
      # - ${SSH_AUTH_SOCK:-/dev/null}:/ssh-agent:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

