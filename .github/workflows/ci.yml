name: CI

on:
  push:
    branches: [main, develop, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, develop, master]

env:
  NODE_VERSION: '22'

jobs:
  typecheck:
    name: Typecheck Desktop Proxy (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

  test-proxy:
    name: Desktop Proxy Tests (vitest) (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm test

  test-doctor:
    name: ag-doctor CLI Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ag-doctor/package-lock.json

      - name: Install dependencies
        working-directory: ag-doctor
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: ag-doctor
        run: npm run lint

      - name: Build
        working-directory: ag-doctor
        run: npm run build

      - name: Run tests
        working-directory: ag-doctor
        run: npm test -- --run

  test-doctor-ui:
    name: ag-doctor-ui Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ag-doctor-ui/package-lock.json

      - name: Install dependencies
        working-directory: ag-doctor-ui
        run: npm ci --no-audit --no-fund

      - name: Build
        working-directory: ag-doctor-ui
        run: npm run build

      - name: Run tests
        working-directory: ag-doctor-ui
        run: npm test -- --run

  build:
    name: Build & Release Artifacts
    runs-on: ubuntu-latest
    needs: [typecheck, test-proxy, test-doctor, test-doctor-ui]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Proxy
        run: npm run build

      - name: Create release zip
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd dist && zip -r ../antigravity-patch-proxy-${{ github.ref_name }}.zip . && cd ..

      - name: Upload binaries to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: antigravity-patch-proxy-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Proxy dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
          if-no-files-found: warn
