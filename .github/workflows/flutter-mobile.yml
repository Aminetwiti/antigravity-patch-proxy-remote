name: Antigravity Unified Release CI/CD

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
    paths:
      - 'remote/mobile/**'
      - 'remote/antigravity-remote-daemon/**'
      - 'ag-doctor/**'
      - 'ag-doctor-ui/**'
      - '.github/workflows/flutter-mobile.yml'
  pull_request:
    paths:
      - 'remote/mobile/**'
      - 'remote/antigravity-remote-daemon/**'
      - 'ag-doctor/**'
      - 'ag-doctor-ui/**'
      - '.github/workflows/flutter-mobile.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publier les binaires sur GitHub Release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  # ── 1. Validation & Tests Mobile ──
  validate:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: remote/mobile
        run: flutter pub get

      - name: Format Check
        working-directory: remote/mobile
        run: dart format --output=none --set-exit-if-changed . || true

      - name: Static Analysis
        working-directory: remote/mobile
        run: flutter analyze

      - name: Unit & Widget Tests
        working-directory: remote/mobile
        run: flutter test --exclude-tags=live

  # ── 2. Build Android Binaries ──
  build-android:
    name: Build Android (APKs + AAB)
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: remote/mobile
        run: flutter pub get

      - name: Build Split APKs (per-ABI)
        working-directory: remote/mobile
        run: flutter build apk --split-per-abi --no-tree-shake-icons

      - name: Build Fat APK (Universal)
        working-directory: remote/mobile
        run: flutter build apk --no-tree-shake-icons

      - name: Build App Bundle (AAB for Play Store)
        working-directory: remote/mobile
        run: flutter build appbundle --no-tree-shake-icons

      - name: Prepare Android Artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts/android
          APK_DIR="remote/mobile/build/app/outputs/flutter-apk"
          AAB_DIR="remote/mobile/build/app/outputs/bundle/release"

          # Universal APK
          if [ -f "$APK_DIR/app-release.apk" ]; then
            cp "$APK_DIR/app-release.apk" release-artifacts/android/antigravity-remote-universal.apk
          fi

          # Per-ABI APKs
          for abi in arm64-v8a armeabi-v7a x86_64; do
            if [ -f "$APK_DIR/app-$abi-release.apk" ]; then
              cp "$APK_DIR/app-$abi-release.apk" release-artifacts/android/antigravity-remote-$abi.apk
            fi
          done

          # AAB
          if [ -f "$AAB_DIR/app-release.aab" ]; then
            cp "$AAB_DIR/app-release.aab" release-artifacts/android/antigravity-remote.aab
          fi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-binaries
          path: release-artifacts/android/
          retention-days: 14

  # ── 3. Build iOS Artifacts ──
  build-ios:
    name: Build iOS (IPA Unsigned + Runner.app)
    runs-on: macos-latest
    needs: [validate]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: remote/mobile
        run: flutter pub get

      - name: Build iOS No Codesign
        working-directory: remote/mobile
        run: flutter build ios --no-codesign --release

      - name: Package Unsigned IPA & App Archive
        shell: bash
        run: |
          mkdir -p release-artifacts/ios
          cd remote/mobile/build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r "$GITHUB_WORKSPACE/release-artifacts/ios/antigravity-remote-ios-unsigned.ipa" Payload
          cd "$GITHUB_WORKSPACE"

          # Also archive runner.app
          cd remote/mobile/build/ios/iphoneos
          zip -r "$GITHUB_WORKSPACE/release-artifacts/ios/antigravity-remote-ios-Runner.app.zip" Runner.app
          cd "$GITHUB_WORKSPACE"

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-binaries
          path: release-artifacts/ios/
          retention-days: 14

  # ── 4. Build Desktop (ag-doctor-ui & antigravity-remote-daemon Windows Executables) ──
  build-desktop:
    name: Build Windows Desktop (ag-doctor-ui.exe & antigravity-remote-daemon.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies & build CLI
        run: |
          npm ci --no-audit --no-fund
          cd ag-doctor
          npm install
          npm run build
          cd ../ag-doctor-ui
          npm install
          npm run build

      - name: Package ag-doctor-ui Windows Executable
        working-directory: ag-doctor-ui
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --win portable --publish never

      - name: Build & Package Antigravity Remote Daemon
        working-directory: remote/antigravity-remote-daemon
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install
          npm run build
          npx electron-builder --win portable --publish never

      - name: Prepare Desktop Artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts/desktop
          cp ag-doctor-ui/release/*.exe release-artifacts/desktop/ || true
          PORTABLE_EXE=$(ls ag-doctor-ui/release/*.exe 2>/dev/null | head -1)
          if [ -f "$PORTABLE_EXE" ]; then
            cp "$PORTABLE_EXE" release-artifacts/desktop/ag-doctor-ui.exe
          fi
          cp remote/antigravity-remote-daemon/release/*.exe release-artifacts/desktop/ || true
          DAEMON_EXE=$(ls remote/antigravity-remote-daemon/release/*.exe 2>/dev/null | head -1)
          if [ -f "$DAEMON_EXE" ]; then
            cp "$DAEMON_EXE" release-artifacts/desktop/antigravity-remote-daemon.exe
          fi

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-binaries
          path: release-artifacts/desktop/
          retention-days: 14

  # ── 5. Publish to GitHub Release ──
  publish-release:
    name: Publish Binaries to GitHub Release
    needs: [build-android, build-ios, build-desktop]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-binaries
          path: dist-release/

      - name: Download iOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-binaries
          path: dist-release/

      - name: Download Desktop Artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-binaries
          path: dist-release/

      - name: Determine Tag Name
        id: release_tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            VERSION=$(grep 'version:' remote/mobile/pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
            echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Antigravity Release ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist-release/antigravity-remote-universal.apk
            dist-release/antigravity-remote-arm64-v8a.apk
            dist-release/antigravity-remote-armeabi-v7a.apk
            dist-release/antigravity-remote-x86_64.apk
            dist-release/antigravity-remote.aab
            dist-release/antigravity-remote-ios-unsigned.ipa
            dist-release/antigravity-remote-ios-Runner.app.zip
            dist-release/ag-doctor-ui.exe
            dist-release/ag-doctor-*-portable.exe
            dist-release/antigravity-remote-daemon*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
