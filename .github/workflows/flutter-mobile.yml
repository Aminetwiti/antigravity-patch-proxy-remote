name: Antigravity Unified Release CI/CD

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
    paths:
      - 'remote/mobile/**'
      - 'ag-doctor/**'
      - 'ag-doctor-ui/**'
      - '.github/workflows/flutter-mobile.yml'
  pull_request:
    paths:
      - 'remote/mobile/**'
      - 'ag-doctor/**'
      - 'ag-doctor-ui/**'
      - '.github/workflows/flutter-mobile.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publier les binaires sur GitHub Release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  # ── 1. Validation & Tests Mobile ──
  validate:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: remote/mobile
        run: flutter pub get

      - name: Analyze code
        working-directory: remote/mobile
        run: flutter analyze --no-fatal-infos

      - name: Run unit & widget tests
        working-directory: remote/mobile
        run: flutter test --exclude-tags=live

  # ── 2. Build Android (APK & AAB) ──
  build-android:
    name: Build Android (APK & AAB)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: remote/mobile
        run: flutter pub get

      - name: Build Universal APK
        working-directory: remote/mobile
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build Split-per-ABI APKs
        working-directory: remote/mobile
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Build Android App Bundle (AAB)
        working-directory: remote/mobile
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Prepare Android Artifacts
        run: |
          mkdir -p release-artifacts/android
          # Universal APK
          cp remote/mobile/build/app/outputs/flutter-apk/app-release.apk release-artifacts/android/antigravity-remote-universal.apk
          # Split APKs
          cp remote/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-artifacts/android/antigravity-remote-arm64-v8a.apk || true
          cp remote/mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-artifacts/android/antigravity-remote-armeabi-v7a.apk || true
          cp remote/mobile/build/app/outputs/flutter-apk/app-x86_64-release.apk release-artifacts/android/antigravity-remote-x86_64.apk || true
          # AAB
          cp remote/mobile/build/app/outputs/bundle/release/app-release.aab release-artifacts/android/antigravity-remote.aab

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-binaries
          path: release-artifacts/android/
          retention-days: 14

  # ── 3. Build iOS (No-codesign IPA / App) ──
  build-ios:
    name: Build iOS (Payload & IPA)
    needs: validate
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: remote/mobile
        run: flutter pub get

      - name: Build iOS Archive (No Codesign)
        working-directory: remote/mobile
        run: flutter build ios --release --no-codesign

      - name: Package iOS IPA & Payload
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release-artifacts/ios"
          mkdir -p build_ipa/Payload
          cp -r remote/mobile/build/ios/iphoneos/Runner.app build_ipa/Payload/
          cd build_ipa
          zip -r "$GITHUB_WORKSPACE/release-artifacts/ios/antigravity-remote-ios-unsigned.ipa" Payload/
          cd "$GITHUB_WORKSPACE"
          # Also archive runner.app
          cd remote/mobile/build/ios/iphoneos
          zip -r "$GITHUB_WORKSPACE/release-artifacts/ios/antigravity-remote-ios-Runner.app.zip" Runner.app
          cd "$GITHUB_WORKSPACE"

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-binaries
          path: release-artifacts/ios/
          retention-days: 14

  # ── 4. Build Desktop (ag-doctor-ui Windows Executable) ──
  build-desktop:
    name: Build Windows Desktop (ag-doctor-ui.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies & build CLI
        run: |
          npm ci --no-audit --no-fund
          cd ag-doctor
          npm install
          npm run build
          cd ../ag-doctor-ui
          npm install
          npm run build

      - name: Package ag-doctor-ui Windows Executables (Installer & Portable)
        working-directory: ag-doctor-ui
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --win nsis portable

      - name: Prepare Desktop Artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts/desktop
          cp ag-doctor-ui/release/*.exe release-artifacts/desktop/ || true
          # Create direct ag-doctor-Setup.exe and ag-doctor-portable.exe aliases
          SETUP_EXE=$(ls ag-doctor-ui/release/*Setup*.exe 2>/dev/null | head -1)
          if [ -f "$SETUP_EXE" ]; then
            cp "$SETUP_EXE" release-artifacts/desktop/ag-doctor-installer.exe
          fi


      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-binaries
          path: release-artifacts/desktop/
          retention-days: 14

  # ── 5. Publish to GitHub Release ──
  publish-release:
    name: Publish Binaries to GitHub Release
    needs: [build-android, build-ios, build-desktop]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-binaries
          path: dist-release/

      - name: Download iOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-binaries
          path: dist-release/

      - name: Download Desktop Artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-binaries
          path: dist-release/

      - name: Determine Tag Name
        id: release_tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            VERSION=$(grep 'version:' remote/mobile/pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
            echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Antigravity Release ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist-release/antigravity-remote-universal.apk
            dist-release/antigravity-remote-arm64-v8a.apk
            dist-release/antigravity-remote-armeabi-v7a.apk
            dist-release/antigravity-remote-x86_64.apk
            dist-release/antigravity-remote.aab
            dist-release/antigravity-remote-ios-unsigned.ipa
            dist-release/antigravity-remote-ios-Runner.app.zip
            dist-release/ag-doctor-ui.exe
            dist-release/ag-doctor-*-portable.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
