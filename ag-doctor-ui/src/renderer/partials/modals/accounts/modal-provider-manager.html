  <div class="modal-backdrop" id="providerManagerModalBackdrop" hidden>
    <div class="modal modal-lg" role="dialog" aria-modal="true" aria-labelledby="pmModalTitle">
      <div class="modal-header">
        <div class="modal-header-title-wrap">
          <button type="button" class="agy-icon-btn" id="pmFormBack" aria-label="Back to providers" title="Back to providers" hidden>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          </button>
          <div class="modal-header-icon" id="pmModalIcon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
          </div>
          <h2 id="pmModalTitle" class="pm-modal-title">Provider Manager</h2>
        </div>
        <button class="modal-close" id="providerManagerModalClose" type="button" aria-label="Close modal">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <!-- LIST VIEW -->
        <div id="pmListContainer" class="modal-list"></div>

        <!-- FORM VIEW -->
        <form id="pmFormContainer" class="pm-form" hidden onsubmit="return false;">
          <!-- SECTION 1: ENDPOINT & CREDENTIALS -->
          <div id="pmSectionEndpoint" class="pm-form-section">
            <h3 class="pm-form-section-title">1. Connection Settings</h3>
            <!-- PRESET QUICK-FILL BAR -->
            <div class="pm-presets-bar">
              <span class="pm-presets-label">Quick Presets</span>
              <div class="pm-presets-row">
                <button type="button" class="btn btn-ghost btn-sm pm-preset-btn" id="presetOllama" title="Ollama local server">Ollama (11434)</button>
                <button type="button" class="btn btn-ghost btn-sm pm-preset-btn" id="presetLMStudio" title="LM Studio local server">LM Studio (1234)</button>
                <button type="button" class="btn btn-ghost btn-sm pm-preset-btn" id="presetOpenRouter" title="OpenRouter cloud AI">OpenRouter</button>
                <button type="button" class="btn btn-ghost btn-sm pm-preset-btn" id="presetDeepSeek" title="DeepSeek API">DeepSeek</button>
                <button type="button" class="btn btn-ghost btn-sm pm-preset-btn" id="presetGoogle" title="Google Gemini API">Google Gemini</button>
                <button type="button" class="btn btn-ghost btn-sm pm-preset-btn" id="presetLocalAI" title="LocalAI server">LocalAI (8000)</button>
              </div>
            </div>

            <div class="pm-form-grid">
              <label class="form-field" for="pmFormName">
                <span>Display name</span>
                <input type="text" id="pmFormName" placeholder="My OpenAI-compatible API" autocomplete="off" />
              </label>

              <label class="form-field" for="pmFormType">
                <span>Provider type</span>
                <select id="pmFormType">
                  <option value="openai">OpenAI-compatible</option>
                  <option value="anthropic">Anthropic</option>
                  <option value="google">Google Gemini</option>
                  <option value="custom">Custom</option>
                </select>
              </label>
            </div>

            <label class="form-field" for="pmFormUrl">
              <span>API URL</span>
              <input type="url" id="pmFormUrl" placeholder="https://api.example.com/v1" autocomplete="off" />
            </label>

            <label class="form-field" for="pmFormKey">
              <span>API key</span>
              <div class="input-with-action">
                <input type="password" id="pmFormKey" placeholder="sk-…" autocomplete="off" />
                <button type="button" class="agy-icon-btn" id="pmKeyToggle" title="Show/Hide API Key" aria-label="Show or hide API key">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </label>

            <label class="form-field-inline" for="pmFormInsecure">
              <input type="checkbox" id="pmFormInsecure" aria-label="Allow insecure connections (self-signed certs)" />
              <span>Allow insecure connections (self-signed certs)</span>
            </label>
          </div>

          <!-- SECTION 2: MODEL CATALOG & FETCHER -->
          <div id="pmSectionModels" class="pm-form-section">
            <h3 class="pm-form-section-title">2. Model Selection</h3>
            <!-- SUMMARY COUNTER & CAPABILITY FILTER BAR -->
            <div class="pm-models-summary-bar">
              <div class="pm-models-counter">
                <span>Selected:</span>
                <span class="badge badge-muted" id="pmModelsCountBadge">0 / 0 models</span>
              </div>
              <div class="pm-cap-filters" id="pmCapFilters">
                <button type="button" class="pm-cap-filter active" data-cap="all">All</button>
                <button type="button" class="pm-cap-filter" data-cap="reasoning">
                  <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10 10 10 0 0 0-10-10z"/><path d="M12 6a4 4 0 1 0 4 4 4 4 0 0 0-4-4z"/></svg> Reasoning
                </button>
                <button type="button" class="pm-cap-filter" data-cap="vision">
                  <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> Vision
                </button>
                <button type="button" class="pm-cap-filter" data-cap="code">
                  <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg> Code
                </button>
              </div>
            </div>

            <div class="pm-models-toolbar">
              <div class="pm-models-search-wrap">
                <input type="text" id="pmModelsSearch" placeholder="Search models…" autocomplete="off" class="input-sm" aria-label="Search models in provider catalog" />
                <button type="button" class="pm-search-clear" id="pmModelsSearchClear" aria-label="Clear search" title="Clear search" hidden>&times;</button>
              </div>
              <div class="pm-models-actions-wrap">
                <button type="button" class="btn btn-ghost btn-sm" id="pmModelsSelectAll">Select all</button>
                <button type="button" class="btn btn-ghost btn-sm" id="pmModelsDeselectAll">Deselect all</button>
                <button type="button" class="btn btn-primary btn-sm" id="pmFormFetchModels" title="Fetch available models from endpoint">
                  <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
                  Fetch models
                </button>
              </div>
            </div>

            <div class="pm-manual-model-row">
              <input type="text" id="pmFormCustomModelInput" placeholder="Add custom model ID (e.g. deepseek-chat)…" autocomplete="off" class="input-sm" aria-label="Add custom model ID" />
              <button type="button" class="btn btn-ghost btn-sm" id="pmFormAddCustomModelBtn">+ Add model</button>
            </div>

            <div id="pmModelsList" class="pm-models-catalog"></div>
          </div>

          <div id="pmFormError" class="form-error" role="alert" hidden></div>

          <div class="pm-form-actions">
            <button type="button" class="btn btn-ghost" id="pmFormBack2">Cancel</button>
            <button type="button" class="btn btn-ghost" id="pmFormTest" title="Test endpoint connection and measure latency">Test connection</button>
            <button type="button" class="btn btn-primary" id="pmFormSave">Save provider</button>
          </div>
        </form>
      </div>

      <!-- LIST VIEW FOOTER — canonical footer, toggled by showPmView() -->
      <div class="modal-footer" id="pmModalFooterList" hidden>
        <button class="btn btn-ghost" id="pmModalClose2" type="button">Close</button>
        <button class="btn btn-ghost" id="pmImportLocalBtn" type="button" title="Auto-detect and import Google account from Antigravity IDE">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Import from IDE
        </button>
        <button class="btn btn-primary" id="pmAddBtn" type="button">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add provider
        </button>
      </div>

      <!-- FORM VIEW FOOTER -->
    </div>
  </div>
