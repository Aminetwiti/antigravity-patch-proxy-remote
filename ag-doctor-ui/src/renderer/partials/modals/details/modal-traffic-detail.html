      <div class="modal-backdrop" id="trafficDetailBackdrop" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="trafficDetailTitle" style="max-width:720px; width:90%;">
          <div class="modal-header">
            <h2 id="trafficDetailTitle" style="margin:0; font-size:16px;">Request Payload & Response Diff</h2>
            <button class="btn btn-ghost btn-sm" id="trafficDetailCloseBtn" type="button" aria-label="Close detail modal">✕</button>
          </div>
          <div class="modal-body" style="padding:16px; display:flex; flex-direction:column; gap:16px; max-height:70vh; overflow-y:auto;">
            <div id="trafficDetailMeta" style="font-family:ui-monospace,monospace; font-size:12px; color:var(--text-2); padding:8px; background:var(--bg-0); border-radius:4px; border:1px solid var(--border);"></div>
            <div id="trafficDetailTiming" style="font-family:ui-monospace,monospace; font-size:11px; padding:8px 12px; background:var(--bg-1); border-radius:4px; border:1px solid var(--border); display:none;"></div>
            <div>
              <h3 style="margin:0 0 4px 0; font-size:12px; color:var(--text-1);">Request Body (Client → Proxy)</h3>
              <pre id="trafficDetailReq" style="margin:0; padding:10px; background:var(--bg-0); border:1px solid var(--border); border-radius:4px; font-family:ui-monospace,monospace; font-size:11px; white-space:pre-wrap; word-break:break-all; max-height:180px; overflow-y:auto;"></pre>
            </div>
            <div>
              <h3 style="margin:0 0 4px 0; font-size:12px; color:var(--text-1);">Response Body (Provider → Proxy)</h3>
              <pre id="trafficDetailRes" style="margin:0; padding:10px; background:var(--bg-0); border:1px solid var(--border); border-radius:4px; font-family:ui-monospace,monospace; font-size:11px; white-space:pre-wrap; word-break:break-all; max-height:180px; overflow-y:auto;"></pre>
            </div>
          </div>
          <div class="modal-footer" style="padding:12px 16px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px;">
            <button class="btn btn-secondary btn-sm" id="trafficCopyCurlBtn" type="button" data-label="traffic-copy-curl-btn">Copy cURL</button>
            <button class="btn btn-primary btn-sm" id="trafficRetryBtn" type="button" data-label="traffic-retry-btn">Retry Request</button>
            <button class="btn btn-ghost btn-sm" id="trafficDetailFooterCloseBtn" type="button">Close</button>
          </div>
        </div>
      </div>
