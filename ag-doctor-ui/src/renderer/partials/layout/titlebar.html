  <!-- Title bar (drag region) -->
  <header class="titlebar">
    <div class="titlebar-drag">
      <div class="brand">
        <div class="brand-mark">
          <img src="assets/icon-32.png" width="18" height="18" alt="Antigravity Doctor logo" style="border-radius:4px; display:block;" />
        </div>
        <div class="brand-text">
          <span class="brand-name">Antigravity Doctor</span>
          <span class="brand-tag">Diagnostic · repair</span>
        </div>
      </div>
    </div>
    <div class="titlebar-actions">
      <button class="btn btn-ghost btn-xs titlebar-update-btn" id="headerCheckUpdateBtn" type="button" title="Check for updates" aria-label="Check for updates">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span>Check updates</span>
      </button>
      <div class="status-pill" id="statusPill">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">Ready</span>
      </div>
    </div>
  </header>

  <!-- Global Smart Banner container -->
  <div id="globalSmartBanner" class="smart-banner-container"></div>
